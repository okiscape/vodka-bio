services:
    caddy:
        image: ghcr.io/okiscape/vodka-bio-caddy:latest
        restart: unless-stopped
        container_name: vodka-caddy
        environment:
            DOMAIN: ${DOMAIN}
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./caddy/certs:/etc/caddy/certs
            - caddy_data:/data
            - caddy_config:/config
        depends_on:
            - frontend
            - backend

    frontend:
        image: ghcr.io/okiscape/vodka-bio-frontend:latest
        restart: unless-stopped
        container_name: vodka-frontend
        environment:
            DOMAIN: ${DOMAIN}
            UMAMI_WEBSITE_ID: ${UMAMI_WEBSITE_ID}
            NODE_ENV: ${NODE_ENV}
            PORT: ${PORT_FRONTEND}
            OTORING_SLUG: ${OTORING_SLUG}
            GITHUB_REPO_URL: ${GITHUB_REPO_URL}
            SENKODIGITAL_REFERRAL: ${SENKODIGITAL_REFERRAL}
            API_BASEURL: ${API_BASEURL}
        depends_on:
            - backend

    backend:
        image: ghcr.io/okiscape/vodka-bio-backend:latest
        restart: unless-stopped
        container_name: vodka-backend
        environment:
            NODE_ENV: ${NODE_ENV}
            DOMAIN: ${DOMAIN}
            PORT: ${PORT_BACKEND}
            GITHUB_TOKEN: ${GITHUB_TOKEN}
            GITHUB_USERNAME: ${GITHUB_USERNAME}
            GITHUB_FRONTEND_CONTAINER_NAME: ${GITHUB_FRONTEND_CONTAINER_NAME}
            GITHUB_BACKEND_CONTAINER_NAME: ${GITHUB_BACKEND_CONTAINER_NAME}
            ADMIN_TOKEN: ${API_ACCESS_TOKEN}
            LASTFM_TOKEN: ${LASTFM_TOKEN}
            LASTFM_USERNAME: ${LASTFM_USERNAME}
            DB_HOST: ${DB_HOST}
            DB_PORT: ${DB_PORT}
            DB_NAME: ${DB_NAME}
            DB_USER: ${DB_USER}
            DB_PASSWORD: ${DB_PASSWORD}
            SHOUTS_COOLDOWN_MS: ${SHOUTS_COOLDOWN_MS}
        volumes:
            - ./store:/app/store
        depends_on:
            - postgres

    postgres:
        image: postgres:17-alpine
        restart: unless-stopped
        container_name: vodka-postgres
        ports:
            - "${DB_PORT:-5432}:5432"
        environment:
            POSTGRES_DB: ${DB_NAME}
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            - pgdata:/var/lib/postgresql/data

    watchtower:
        image: containrrr/watchtower
        restart: unless-stopped
        container_name: vodka-watchtower
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - ~/.docker/config.json:/config.json
        command: --interval 60 --cleanup
        environment:
            - DOCKER_API_VERSION=1.40

    umami:
        image: docker.umami.is/umami-software/umami:postgresql-latest
        restart: unless-stopped
        container_name: vodka-umami
        environment:
            DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@umami-db:5432/umami
            DATABASE_TYPE: postgresql
            APP_SECRET: ${UMAMI_APP_SECRET}
            TRACKER_SCRIPT_NAME: metrics
        depends_on:
            - umami-db

    umami-db:
        image: postgres:15-alpine
        restart: unless-stopped
        container_name: vodka-umami-db
        environment:
            POSTGRES_DB: umami
            POSTGRES_USER: umami
            POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD}
        volumes:
            - umami_db_data:/var/lib/postgresql/data

volumes:
    caddy_data:
    caddy_config:
    pgdata:
    umami_db_data:
